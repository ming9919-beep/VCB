version: 2

# Dependabot：依赖与 Actions 版本自动巡检
# 有漏洞的依赖会同时被「安全更新」推送修复 PR（随手合并即可）

updates:
  # 前端 npm 依赖（package-lock.json 在仓库根目录）
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Phnom_Penh
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: "deps"
      include: scope
    groups:
      react-stack:
        patterns:
          - "react"
          - "react-dom"
          - "react-router-dom"
          - "@vitejs/*"
      qr-and-ocr:
        patterns:
          - "jsqr"
          - "qrcode"
          - "vietqr"
          - "tesseract.js"
      tooling:
        patterns:
          - "vite"
          - "typescript"
    ignore:
      # 主版本升级风险大，手工评估后再升
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions 自身版本
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Phnom_Penh
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
