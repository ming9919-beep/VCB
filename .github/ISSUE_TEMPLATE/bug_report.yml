name: 缺陷报告
description: 页面、扫码、户名查询、构建等功能异常
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先确认不是本地环境问题（`.env.local` 是否配好、`api-server` 是否启动）。
  - type: textarea
    id: what-happened
    attributes:
      label: 现象描述
      description: 实际发生了什么，期望是什么
      placeholder: 例如：扫码后户名一直显示「无法查询」
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 /transfer
        2. 点击扫码
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响模块
      options:
        - 登录 / 支付密码
        - 转账 / 扫码
        - 户名查询（BankLookup）
        - VietQR Reader 代理
        - 页面样式 / 多语言
        - 构建 / 部署
        - 其他
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 运行环境
      description: 浏览器版本、系统、是否为 Pages 线上
      placeholder: Chrome 130 / Windows 11 / ming9919-beep.github.io/VCB
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 报错日志 / 截图
      description: 控制台输出、接口返回、截图
      render: shell
    validations:
      required: false
